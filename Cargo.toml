[package]
name = "xr-files"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "3D spatial file manager for the openKylin XR desktop (Rust / wgpu / SIMD)"

[dependencies]
anyhow = "1"
ab_glyph = "0.2"
ash = { version = "0.38", default-features = false, features = ["loaded", "debug", "std"] }
bytemuck = { version = "1.21", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "ico"] }
libc = "0.2"
openxr = "=0.22.0"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wgpu = { version = "24.0", default-features = false, features = ["wgc", "wgsl"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }

[profile.release]
lto = "thin"
codegen-units = 1
